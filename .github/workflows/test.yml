name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - run: pnpm install --frozen-lockfile

      - id: lint
        run: pnpm lint

      - id: typecheck
        run: pnpm typecheck

      - id: test
        run: pnpm test

      - id: build
        run: pnpm build

      - id: build-firefox
        run: pnpm build:firefox

      - id: manifest
        run: node scripts/check-manifest.mjs

      - if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        name: Collapse previous test comments
        continue-on-error: true
        run: |
          gh api graphql -f query='
            query($owner:String!,$repo:String!,$pr:Int!) {
              repository(owner:$owner,name:$repo) {
                pullRequest(number:$pr) {
                  comments(last:100) {
                    nodes { id body isMinimized }
                  }
                }
              }
            }' -f owner="${GITHUB_REPOSITORY_OWNER}" \
               -f repo="${GITHUB_REPOSITORY#*/}" \
               -F pr="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.comments.nodes[]
              | select(.body | contains("<!-- test-result -->"))
              | select(.isMinimized == false)
              | .id' \
          | while read -r node_id; do
              gh api graphql -f query='
                mutation($id:ID!) {
                  minimizeComment(input:{subjectId:$id,classifier:OUTDATED}) {
                    minimizedComment { isMinimized }
                  }
                }' -f id="$node_id"
            done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        name: Comment check failure
        continue-on-error: true
        run: |
          gh pr comment "$PR_NUMBER" --body "<!-- test-result -->
          > [!WARNING]
          > **$FAILED failed** — see the [workflow run]($RUN_URL)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FAILED: ${{ steps.lint.outcome == 'failure' && 'Lint' || steps.typecheck.outcome == 'failure' && 'Type check' || steps.test.outcome == 'failure' && 'Tests' || steps.build.outcome == 'failure' && 'Chrome build' || steps.build-firefox.outcome == 'failure' && 'Firefox build' || steps.manifest.outcome == 'failure' && 'Manifest check' || 'Setup' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
